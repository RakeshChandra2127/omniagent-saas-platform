@if (user$ | async; as user) {
  <mat-sidenav-container class="app-container">
    <mat-sidenav mode="side" opened class="app-sidenav">
      <div class="sidenav-header">
        <h2>OmniAgent</h2>
      </div>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/inbox" routerLinkActive="active">
          <mat-icon matListItemIcon>inbox</mat-icon>
          <span matListItemTitle>Inbox</span>
        </a>
        <a mat-list-item routerLink="/agents" routerLinkActive="active">
          <mat-icon matListItemIcon>smart_toy</mat-icon>
          <span matListItemTitle>Agents</span>
        </a>
        <a mat-list-item routerLink="/contacts" routerLinkActive="active">
          <mat-icon matListItemIcon>contacts</mat-icon>
          <span matListItemTitle>Contacts</span>
        </a>
        <a mat-list-item routerLink="/leads" routerLinkActive="active">
          <mat-icon matListItemIcon>monetization_on</mat-icon>
          <span matListItemTitle>Leads</span>
        </a>
        <a mat-list-item routerLink="/bookings" routerLinkActive="active">
          <mat-icon matListItemIcon>event</mat-icon>
          <span matListItemTitle>Bookings</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar color="primary">
        <span>{{ title }}</span>
        <span class="spacer"></span>
        <div class="user-menu">
          <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
          <button mat-icon-button (click)="logout()" title="Logout">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      </mat-toolbar>
      <div class="main-content">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet></router-outlet>
}
